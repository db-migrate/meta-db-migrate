# The tests against every database, and a release on a tag.
#
# meta is not open source. The metalanguage repository publishes it, binary
# and headers, as the image wxone/meta, and this only uses it: copied out to
# /opt/meta - see .github/actions/meta. META_IMAGE picks another tag than
# wxone/meta:latest.
#
# compat moves a project between node db-migrate and this, both ways, against
# node-db-migrate and its pg driver as published (NODE_DB_MIGRATE_REF,
# NODE_PG_REF).
name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [pg, cockroachdb, mysql, sqlite3, options, plugins, static, embed]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/meta
        with:
          image: ${{ vars.META_IMAGE || 'wxone/meta:latest' }}

      - name: system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libpq-dev \
            libmysqlclient-dev libsqlite3-dev libyaml-dev libssl-dev sqlite3 \
            postgresql-client mysql-client openssh-server bison flex

      - name: databases
        run: |
          case ${{ matrix.suite }} in
            pg|plugins|static)
              docker run -d --name dbm-meta-pg -e POSTGRES_PASSWORD=dbm \
                -e POSTGRES_DB=dbm -p 127.0.0.1:55432:5432 postgres:12-alpine
              until pg_isready -q -h 127.0.0.1 -p 55432; do sleep 1; done ;;
            cockroachdb)
              docker run -d --name dbm-meta-crdb -p 127.0.0.1:56257:26257 \
                cockroachdb/cockroach:latest-v24.3 start-single-node --insecure
              until docker exec dbm-meta-crdb ./cockroach sql --insecure \
                  -e "create database if not exists dbm" 2>/dev/null; do
                sleep 1
              done ;;
            mysql)
              docker run -d --name dbm-meta-mysql -e MYSQL_ROOT_PASSWORD=dbm \
                -e MYSQL_DATABASE=dbm -p 127.0.0.1:53306:3306 \
                mysql:8.0.28-oracle
              until mysql -h127.0.0.1 -P53306 -uroot -pdbm -e "select 1" dbm \
                  >/dev/null 2>&1; do
                sleep 1
              done ;;
          esac
          # sshd will not start, even as a user, without its directory
          sudo mkdir -p /run/sshd

      - name: build
        run: ./build.sh

      - name: test
        run: |
          case ${{ matrix.suite }} in
            options|plugins|static|embed) test/${{ matrix.suite }}.sh ;;
            *) test/run.sh ${{ matrix.suite }} ;;
          esac

  # its own job, so the node steps are only where node is
  compat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/meta
        with:
          image: ${{ vars.META_IMAGE || 'wxone/meta:latest' }}

      - name: system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libpq-dev \
            libmysqlclient-dev libsqlite3-dev libyaml-dev postgresql-client

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/checkout@v7
        with:
          repository: db-migrate/node-db-migrate
          ref: ${{ vars.NODE_DB_MIGRATE_REF || 'master' }}
          path: build/node-db-migrate

      - uses: actions/checkout@v7
        with:
          repository: db-migrate/pg
          ref: ${{ vars.NODE_PG_REF || 'master' }}
          path: build/pg

      - name: node dependencies
        run: |
          (cd build/node-db-migrate && npm install --omit=dev --no-audit --no-fund)
          (cd build/pg && npm install --omit=dev --no-audit --no-fund)

      - name: database
        run: |
          docker run -d --name dbm-meta-pg -e POSTGRES_PASSWORD=dbm \
            -e POSTGRES_DB=dbm -p 127.0.0.1:55432:5432 postgres:12-alpine
          until pg_isready -q -h 127.0.0.1 -p 55432; do sleep 1; done

      - name: build
        run: ./build.sh

      - name: test
        env:
          NODE_DB_MIGRATE: ${{ github.workspace }}/build/node-db-migrate
          NODE_PG: ${{ github.workspace }}/build/pg
        run: test/compat.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, compat]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/meta
        with:
          image: ${{ vars.META_IMAGE || 'wxone/meta:latest' }}

      - name: system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libpq-dev \
            libmysqlclient-dev libsqlite3-dev libyaml-dev libssl-dev bison flex

      - name: release
        run: |
          sudo mkdir -p /opt/meta-db-migrate
          sudo chown "$(id -u):$(id -g)" /opt/meta-db-migrate
          # built on Ubuntu 24.04: the programs it builds want glibc 2.39
          glibc=$(ldd --version | sed -n '1s/.* //p')
          tools/release.sh /opt/meta /opt/meta-db-migrate \
            "dist/meta-db-migrate-${GITHUB_REF_NAME}-linux-x86_64-glibc${glibc}.tar.gz"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # this version's part of CHANGELOG.md, up to the one before it
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; found = index($0, v) > 0 }
            found' CHANGELOG.md >release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.cdx.json \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
